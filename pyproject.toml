[build-system]
requires = ["hatchling==1.33.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "roboassist-offline-stt"
version = "0.1.0"
description = "Offline magyar beszédfelismerés – fejlesztői alapok"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper==1.2.1",
    "numpy>=2,<3",
    "PySide6-Essentials==6.12.0",
    "sounddevice==0.5.6",
]

[project.scripts]
roboassist-config = "offline_stt.__main__:main"

[dependency-groups]
dev = [
    "editables==0.5",
    "hatchling==1.33.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "uv==0.13.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/offline_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/offline_stt"]
