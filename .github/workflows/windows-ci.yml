name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 x64 checks
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner and lock identity
        run: |
          $PSVersionTable.PSVersion.ToString()
          Write-Output "Runner image: $env:ImageOS / $env:ImageVersion"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          Write-Output ("Lock SHA-256: " + (Get-FileHash -LiteralPath requirements.lock -Algorithm SHA256).Hash)

      - name: Setup locked Python environment
        run: .\scripts\setup-dev.ps1

      - name: Lint
        run: >-
          .\.venv\Scripts\python.exe -m ruff check src tests
          scripts/check-environment.py scripts/prepare-qt-license-bundle.py

      - name: Format
        run: >-
          .\.venv\Scripts\python.exe -m ruff format --check src tests
          scripts/check-environment.py scripts/prepare-qt-license-bundle.py

      - name: Strict typecheck
        run: .\.venv\Scripts\python.exe -m mypy

      - name: Unit, audio and pipeline replay integration tests
        run: .\.venv\Scripts\python.exe -m pytest --basetemp=.tools/ci-pytest -p no:cacheprovider

      - name: Installed config entrypoint
        run: .\.venv\Scripts\roboassist-config.exe --config configs/default.toml

      - name: Native offline environment smoke
        run: .\.venv\Scripts\python.exe scripts/check-environment.py
