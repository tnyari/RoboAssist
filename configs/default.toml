# Teljes schema-v1 konfiguráció. Betöltő: offline_stt.config.load_config (#16).
schema_version = 1

[application]
language = "hu"
offline = true
telemetry = false

[audio]
sample_rate_hz = 16000
channels = 1
frame_ms = 20

[engine]
backend = "faster-whisper"
model = "base-multilingual"
# Logikai modellazonosító; kizárólag a models/manifest.json szerinti helyi modell.
device = "cpu"
compute_type = "int8"
allow_automatic_download = false

[vad]
pre_roll_ms = 250
end_silence_ms = 500
max_segment_ms = 12000
energy_threshold_db = -42.0
hysteresis_db = 6.0

[pipeline]
partial_interval_ms = 750
partial_window_ms = 5000
frame_queue_capacity = 64
final_queue_capacity = 4
event_queue_capacity = 64
stop_timeout_ms = 5000

[privacy]
save_audio = false
save_transcript = false
export_requires_user_action = true

# A beállítások nem jelentenek mért késleltetési vagy pontossági eredményt.
